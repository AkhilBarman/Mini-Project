[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucination-detector"
version = "0.1.0"
description = "Detecting Hallucinations in AI-Generated Summaries of Indian Legal Judgments"
authors = [{ name = "Akhil Barman" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "pytest>=7.0.0",
    "nltk>=3.8.1",
    "pysbd>=0.3.4"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
